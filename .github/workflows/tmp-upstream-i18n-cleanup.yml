name: Temporary finalize locale migration

on:
  push:
    branches:
      - chore/remove-terminology-layer

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[locale-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migrate remaining TripInsight copy into existing zh locale
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("surfsense_web/messages/zh.json")
          text = path.read_text()
          replacements = [
              ('"leave_confirm": "您确定要退出「{name}」吗？您将无法访问此搜索空间中的所有文档和对话。"', '"leave_confirm": "您确定要退出「{name}」吗？您将无法访问此研究空间中的知识与研究记录。"'),
              ('"error_loading_space": "加载搜索空间失败"', '"error_loading_space": "加载研究空间失败"'),
              ('"unknown_workspace": "未知搜索空间"', '"unknown_workspace": "未知研究空间"'),
              ('"delete_chat": "删除对话"', '"delete_chat": "删除研究记录"'),
              ('"delete_workspace": "删除搜索空间"', '"delete_workspace": "删除研究空间"'),
              ('"no_spaces_found": "未找到搜索空间"', '"no_spaces_found": "未找到研究空间"'),
              ('"create_first_space": "创建您的第一个搜索空间以开始使用"', '"create_first_space": "创建第一个研究空间以开始目的地研究"'),
              ('"manage_documents": "管理文档"', '"manage_documents": "管理知识库"'),
              ('"manage_connectors": "管理连接器"', '"manage_connectors": "管理数据源"'),
              ('"no_connectors_desc": "您还没有添加任何连接器。添加一个来增强您的搜索能力。"', '"no_connectors_desc": "连接公开网络、协作工具或业务数据，让研究拥有更完整的证据。"'),
              ('"add_first": "添加您的第一个连接器"', '"add_first": "添加第一个数据源"'),
              ('"error_loading_chats": "加载对话时出错"', '"error_loading_chats": "加载研究记录时出错"'),
              ('"chat_deleted": "对话删除成功"', '"chat_deleted": "研究记录已删除"'),
              ('"error_deleting_chat": "删除对话失败"', '"error_deleting_chat": "删除研究记录失败"'),
              ('"chat_archived": "对话已归档"', '"chat_archived": "研究记录已归档"'),
              ('"chat_unarchived": "对话已恢复"', '"chat_unarchived": "研究记录已恢复"'),
              ('"chat_renamed": "对话已重命名"', '"chat_renamed": "研究记录已重命名"'),
              ('"error_renaming_chat": "重命名对话失败"', '"error_renaming_chat": "重命名研究记录失败"'),
              ('"rename_chat": "重命名对话"', '"rename_chat": "重命名研究记录"'),
              ('"rename_chat_description": "为此对话输入新名称。"', '"rename_chat_description": "为这条研究记录输入新名称。"'),
              ('"chat_title_placeholder": "对话标题"', '"chat_title_placeholder": "研究标题"'),
              ('"no_archived_chats": "暂无已归档对话"', '"no_archived_chats": "暂无已归档研究"'),
              ('"error_archiving_chat": "归档对话失败"', '"error_archiving_chat": "归档研究记录失败"'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing expected locale entry: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Format and test
        working-directory: surfsense_web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec biome check --write messages/zh.json
          pnpm test:unit

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surfsense_web/messages/zh.json
          git commit -m "fix: finish TripInsight locale migration [locale-finalized]"
          git push
