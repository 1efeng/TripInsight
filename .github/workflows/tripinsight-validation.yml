name: TripInsight Temporary Validation

on:
  push:
    branches:
      - feat/tripinsight-productization

concurrency:
  group: tripinsight-temporary-validation
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend TripInsight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        working-directory: surfsense_web
        run: pnpm install --frozen-lockfile

      - name: Check changed frontend files with Biome
        shell: bash
        run: |
          mapfile -t web_files < <(
            git diff --name-only origin/main...HEAD -- surfsense_web \
              | sed 's#^surfsense_web/##' \
              | grep -E '\.(ts|tsx|js|jsx|json|css)$' || true
          )
          if [ "${#web_files[@]}" -gt 0 ]; then
            cd surfsense_web
            pnpm exec biome check --diagnostic-level=error "${web_files[@]}"
          fi

      - name: Run frontend unit tests
        working-directory: surfsense_web
        run: pnpm test:unit

      - name: Build frontend
        working-directory: surfsense_web
        run: pnpm build

  backend:
    name: Backend TripInsight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install backend dependencies
        working-directory: surfsense_backend
        run: uv sync

      - name: Check changed Python formatting and lint
        working-directory: surfsense_backend
        run: |
          uv run ruff check \
            app/agents/chat/multi_agent_chat/main_agent/system_prompt/builder/compose.py \
            tests/unit/agents/multi_agent_chat/test_tripinsight_research_prompt.py
          uv run ruff format --check \
            app/agents/chat/multi_agent_chat/main_agent/system_prompt/builder/compose.py \
            tests/unit/agents/multi_agent_chat/test_tripinsight_research_prompt.py

      - name: Run TripInsight prompt tests
        working-directory: surfsense_backend
        run: uv run pytest tests/unit/agents/multi_agent_chat/test_tripinsight_research_prompt.py -q
