name: TripInsight Temporary Formatter

on:
  push:
    branches:
      - feat/tripinsight-productization

permissions:
  contents: write

concurrency:
  group: tripinsight-temporary-formatter
  cancel-in-progress: true

jobs:
  format:
    name: Format TripInsight Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        working-directory: surfsense_web
        run: pnpm install --frozen-lockfile

      - name: Format changed frontend files
        shell: bash
        run: |
          mapfile -t web_files < <(
            git diff --name-only origin/main...HEAD -- surfsense_web \
              | sed 's#^surfsense_web/##' \
              | grep -E '\.(ts|tsx|js|jsx|json|css)$' || true
          )
          if [ "${#web_files[@]}" -gt 0 ]; then
            cd surfsense_web
            pnpm exec biome check --write "${web_files[@]}" || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Format changed backend Python files
        working-directory: surfsense_backend
        run: |
          uvx ruff@0.15.8 format \
            app/agents/chat/multi_agent_chat/main_agent/system_prompt/builder/compose.py \
            tests/unit/agents/multi_agent_chat/test_tripinsight_research_prompt.py

      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surfsense_web surfsense_backend/app/agents/chat/multi_agent_chat/main_agent/system_prompt/builder/compose.py surfsense_backend/tests/unit/agents/multi_agent_chat/test_tripinsight_research_prompt.py
          if git diff --cached --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git commit -m "style: format TripInsight changes"
          git push
